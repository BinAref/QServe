# Build the three things this product ships, and publish them.
#
#   developer/   the vendor's licence server. Not a thing a restaurant runs.
#   restaurant/  the restaurant's own server, console and front-ends.
#   phone/       the Android app for a restaurant's own devices.
#
# Neither can honestly be built on a developer's laptop alone: the Windows
# bundle carries a native SQLite that has to be compiled on Windows, and the
# Android package needs the Android SDK. Both runners here have what they need.
#
# A release is cut by writing its version into `packaging/release.txt` and
# pushing that, which is a normal commit anybody with write access can make —
# no tag push, no token with special powers, and the reason for the release
# sits in the commit message beside it. The workflow tags the commit itself
# when it publishes.
#
# It can also be run by hand from the Actions tab: with a tag it publishes,
# without one it just builds and attaches the artifacts to the run.

name: Release

on:
  push:
    paths:
      - 'packaging/release.txt'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish as, e.g. v1.0.0. Leave empty to build only.'
        required: false
        type: string

permissions:
  contents: write

jobs:
  check:
    name: Build, test and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run validate
      - run: npm test

  windows:
    name: Windows executables
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      # The vendor's public keys, so an activation certificate can be verified
      # on a restaurant's computer with the internet unplugged. Only ever the
      # public half; the signing key never leaves the vendor's own machine.
      # A secret cannot be tested in an `if:` — GitHub refuses the whole
      # workflow for it — so the emptiness is checked where it is readable.
      - name: Write the trust store and the vendor's details
        env:
          TRUSTED_KEYS: ${{ secrets.QSERVE_TRUSTED_KEYS }}
          VENDOR_INFO: ${{ secrets.QSERVE_VENDOR_INFO }}
        shell: bash
        run: |
          if [ -n "$TRUSTED_KEYS" ]; then
            printf '%s' "$TRUSTED_KEYS" > apps/server/config/trusted-keys.json
            echo "trust store written from QSERVE_TRUSTED_KEYS"
          else
            echo "no QSERVE_TRUSTED_KEYS secret: this build cannot activate anything"
          fi
          if [ -n "$VENDOR_INFO" ]; then
            printf '%s' "$VENDOR_INFO" > apps/server/config/vendor.json
            echo "vendor details written from QSERVE_VENDOR_INFO"
          else
            echo "no QSERVE_VENDOR_INFO secret: the licence screen will say 'ask us'"
          fi

      # A build that ships to restaurants and cannot activate is not a release,
      # it is a download that wastes somebody's evening. The two secrets that
      # decide that are checked here rather than warned about: the first 1.0.15
      # shipped asking localhost for its licence, and only running the finished
      # exe found it.
      - name: Refuse to publish a build that cannot activate
        if: github.event_name == 'push' || inputs.tag != ''
        env:
          TRUSTED_KEYS: ${{ secrets.QSERVE_TRUSTED_KEYS }}
          VENDOR_URL: ${{ secrets.QSERVE_VENDOR_URL }}
          VENDOR_INFO: ${{ secrets.QSERVE_VENDOR_INFO }}
        shell: bash
        run: |
          missing=
          [ -n "$TRUSTED_KEYS" ] || missing="$missing QSERVE_TRUSTED_KEYS"
          [ -n "$VENDOR_URL" ] || missing="$missing QSERVE_VENDOR_URL"
          # 1.0.14 through 1.0.18 all went out with no contact details,
          # because this one only warned: the licence screen said "ask us"
          # and listed nobody to ask. A restaurant that cannot find the
          # vendor cannot buy a licence, which is the same failure as not
          # being able to verify one.
          [ -n "$VENDOR_INFO" ] || missing="$missing QSERVE_VENDOR_INFO"
          if [ -n "$missing" ]; then
            echo "::error::cannot publish without:$missing — a restaurant running this"
            echo "::error::build would have nowhere to ask for a licence, no key to"
            echo "::error::verify one with, or nobody to ask. Set the secret and re-run."
            exit 1
          fi
          # Present is not the same as usable: a details file with an empty
          # contact list is the thing that shipped.
          contacts=$(printf '%s' "$VENDOR_INFO" | node -e '
            let raw = "";
            process.stdin.on("data", (d) => { raw += d; });
            process.stdin.on("end", () => {
              try {
                const info = JSON.parse(raw);
                process.stdout.write(String((info.contacts ?? []).length));
              } catch {
                process.stdout.write("bad-json");
              }
            });
          ')
          if [ "$contacts" = "bad-json" ]; then
            echo "::error::QSERVE_VENDOR_INFO is not valid JSON"
            exit 1
          fi
          if [ "$contacts" = "0" ]; then
            echo "::error::QSERVE_VENDOR_INFO lists no contacts, so the licence screen"
            echo "::error::would say 'ask us' with nobody to ask."
            exit 1
          fi
          echo "all three secrets present; the vendor has $contacts contact(s)"

      # Both Windows halves on the one runner: they need the same toolchain,
      # and the setup costs more than either build. One file out apiece — no
      # zip to unpack, no folder to keep together.
      - name: Build the restaurant server
        env:
          # Where this build asks for a licence. Without it the exe falls back
          # to localhost:8090 and no restaurant can ever activate — which is
          # exactly what shipped in the first 1.0.15, because the secret was
          # wired into the Android job and only that one.
          QSERVE_VENDOR_URL: ${{ secrets.QSERVE_VENDOR_URL }}
        run: node packaging/restaurant/build.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/restaurant/*.exe
            dist/developer/*.exe
          if-no-files-found: error

  android:
    name: Android apps
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      # Pinned rather than whatever the runner happens to ship: the Android
      # plugin is particular about which Gradle it will work with.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # The restaurant's terminal, and only that one.
      #
      # This used to build a second flavour for the vendor as well: the same
      # WebView, pointed at the licence server's own console. There is no such
      # console any more — it moved into Supabase, and the flavour went on
      # opening `<vendor-url>/admin`, which answers "Requested function was not
      # found" and had done since the move. The vendor's application is now
      # apps/vendor, built below, and is not a browser in a box.
      - name: Build the restaurant terminal
        working-directory: packaging/phone
        run: gradle --no-daemon assembleRestaurantRelease

      - name: Name it after the version
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          mkdir -p dist/phone
          cp packaging/phone/app/build/outputs/apk/restaurant/release/app-restaurant-release.apk \
             "dist/phone/QServe-Terminal-${version}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/phone/*.apk
          if-no-files-found: error

  vendor:
    name: The vendor application
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Pinned, for the same reason everything else here is: a toolchain that
      # moves on its own turns a reproducible build into a weather report.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.1'
          channel: stable
          cache: true

      # Where it talks, the key it opens with, and whose account it is. The
      # first two are public and come from supabase/project.json; the email is
      # a secret only because an address in a public repository is an address
      # in a public repository.
      - name: Write its configuration
        env:
          QSERVE_VENDOR_EMAIL: ${{ secrets.QSERVE_VENDOR_EMAIL }}
        run: node tools/build-vendor-config.mjs

      - name: Refuse to publish an application with nobody to sign in as
        if: github.event_name == 'push' || inputs.tag != ''
        env:
          QSERVE_VENDOR_EMAIL: ${{ secrets.QSERVE_VENDOR_EMAIL }}
        shell: bash
        run: |
          if [ -z "$QSERVE_VENDOR_EMAIL" ]; then
            echo "::error::no QSERVE_VENDOR_EMAIL — every password would be refused"
            exit 1
          fi
          echo "it signs in as a real account"

      - name: Check and test it
        working-directory: apps/vendor
        run: |
          flutter pub get
          flutter analyze
          flutter test

      # Split by architecture: one 50 MB file that carries three machines'
      # worth of code, or three files of about seventeen. A vendor installing
      # this on their own phone downloads one of them.
      - name: Build the Android application
        working-directory: apps/vendor
        run: flutter build apk --release --split-per-abi

      # What this runner actually has.
      #
      # The first attempt failed with CMake choosing "Visual Studio 16 2019"
      # and then not finding it, which is what Flutter toolchain detection
      # coming back empty looks like from the outside. Guessing at a fix
      # costs a build each time; this asks.
      - name: What this machine has
        continue-on-error: true
        run: |
          flutter doctor -v
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio/Installer/vswhere.exe"
          if (Test-Path $vswhere) {
            & $vswhere -products * -format value -property displayName
            & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          } else {
            Write-Output "no vswhere: this image has no Visual Studio installer"
          }

      - name: Build the Windows application
        working-directory: apps/vendor
        run: flutter build windows --release

      - name: Collect them
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          mkdir -p dist/vendor
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "apps/vendor/build/app/outputs/flutter-apk/app-$abi-release.apk" \
               "dist/vendor/QServe-Vendor-${version}-${abi}.apk"
          done
          # Windows is a folder, not a file: the exe needs the engine and the
          # assets beside it. One zip, so there is one thing to download.
          cd apps/vendor/build/windows/x64/runner/Release
          7z a -tzip "$GITHUB_WORKSPACE/dist/vendor/QServe-Vendor-${version}-windows-x64.zip" ./*

      - uses: actions/upload-artifact@v4
        with:
          name: vendor
          path: dist/vendor/*
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: [windows, android, vendor]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The version to publish as: what the person dispatching asked for, or
      # what the marker file says. Empty means this was a build, not a release.
      - name: Work out the version
        id: version
        shell: bash
        run: |
          tag='${{ github.event.inputs.tag }}'
          if [ -z "$tag" ] && [ -f packaging/release.txt ]; then
            tag=$(grep -m1 -E '^v[0-9]' packaging/release.txt || true)
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Publishing as: ${tag:-(nothing — build only)}"

      - uses: actions/download-artifact@v4
        if: ${{ steps.version.outputs.tag != '' }}
        with:
          path: artifacts

      - name: Collect what was built
        if: ${{ steps.version.outputs.tag != '' }}
        shell: bash
        run: |
          mkdir -p dist
          find artifacts -type f \( -name '*.exe' -o -name '*.apk' -o -name '*.zip' \)             -exec cp {} dist/ \;
          ls -l dist

      - name: Publish
        if: ${{ steps.version.outputs.tag != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: QServe ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          body_path: packaging/RELEASE_NOTES.md
          fail_on_unmatched_files: true
